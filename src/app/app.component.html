<h1 class="bg-dark text-white">Card Task</h1>

<div class="container">
    <div class="row">
        <div class="col-md-4 mb-4" *ngFor="let post of cardArr ">
            <div class="card">
                <div class="card-header bg-dark text-white">
                    {{post.topic}}
                </div>
                <div class="card-body">
                    {{post.details}}
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <button mat-mini-fab color="" aria-label="Example icon button with a delete icon">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-mini-fab color="warn" aria-label="Example icon button with a delete icon">
                        <mat-icon>delete</mat-icon>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<hr style="border-top: 6px solid red;">
